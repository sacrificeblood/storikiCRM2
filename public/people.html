<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minon Devils — участники</title><style>
:root{color-scheme:dark;--bg:#09070a;--s:#171016;--line:#ffffff22;--t:#f5ece8;--m:#aa9ca2;--red:#ed294b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Inter,system-ui,sans-serif}header,main{max-width:980px;margin:auto;padding:18px}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}h1{font:900 22px Arial Black,Arial;margin:0}button,input,select{font:inherit;border-radius:7px}button{cursor:pointer;border:1px solid var(--line);background:#0c080b;color:var(--t);padding:10px 13px}.primary{background:var(--red);border-color:var(--red);font-weight:800}.back{margin-left:auto}section{margin-top:22px;border:1px solid var(--line);background:var(--s);border-radius:10px;padding:18px}form{display:grid;grid-template-columns:1fr 1fr 1fr 130px auto;gap:10px}input,select{min-width:0;padding:10px;border:1px solid var(--line);background:#0c080b;color:var(--t)}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--m);font-size:11px;text-transform:uppercase}.muted,#error{color:var(--m)}#error{color:#ff9aab;margin-top:10px}@media(max-width:700px){form{grid-template-columns:1fr 1fr}form button{grid-column:1/-1}table{font-size:12px}th:nth-child(4),td:nth-child(4){display:none}}
</style></head><body><header><h1>УЧАСТНИКИ</h1><span id="role" class="muted"></span><button class="back" onclick="location.href='/'">← В CRM</button></header><main><section><h2 id="formTitle">Новый участник</h2><form id="form" novalidate><input id="name" placeholder="Имя" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль (от 8 символов)" required><select id="roleSelect"><option value="assistant">Ассистент</option><option value="buyer">Баер</option></select><button class="primary">Выдать доступ</button></form><div id="error"></div></section><section><h2>Доступы</h2><div id="list" class="muted">Загрузка…</div></section></main><script>
let me;const $=id=>document.getElementById(id);async function api(url,opts){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}async function render(){const d=await api('/api/users');$('list').innerHTML='<table><thead><tr><th>Имя</th><th>Email</th><th>Роль</th><th>Пространство</th><th>Статус</th></tr></thead><tbody>'+d.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role==='buyer'?'Баер':u.role==='assistant'?'Ассистент':'Админ'}</td><td>${u.workspaceId||'—'}</td><td>${u.active?'Активен':'Отключён'}</td></tr>`).join('')+'</tbody></table>'}async function boot(){try{me=(await api('/api/auth/me')).user;$('role').textContent=me.role==='admin'?'Администратор':'Баер';if(me.role!=='admin'){$('roleSelect').innerHTML='<option value="assistant">Ассистент</option>';}$('formTitle').textContent=me.role==='admin'?'Создать доступ':'Добавить ассистента';await render()}catch(e){location.replace('/login')}}$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';try{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value,role:$('roleSelect').value})});e.target.reset();await render()}catch(e){$('error').textContent=e.message}});boot();
</script></body></html>
