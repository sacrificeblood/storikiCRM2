<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minon Devils — управление доступами</title><style>
:root{color-scheme:dark;--bg:#09070a;--s:#171016;--s2:#0c080b;--line:#ffffff22;--t:#f5ece8;--m:#aa9ca2;--red:#ed294b;--green:#78d39a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(80% 36% at 50% 0,#35101a,var(--bg) 60%);color:var(--t);font:14px Inter,system-ui,sans-serif}header,main{max-width:1100px;margin:auto;padding:18px}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}h1{font:900 22px Arial Black,Arial;margin:0}h2{margin:0 0 16px;font-size:17px}button,input,select{font:inherit;border-radius:7px}button{cursor:pointer;border:1px solid var(--line);background:var(--s2);color:var(--t);padding:9px 12px}.primary{background:var(--red);border-color:var(--red);font-weight:800}.back{margin-left:auto}section{margin-top:22px;border:1px solid var(--line);background:var(--s);border-radius:10px;padding:18px;box-shadow:0 15px 44px #0004}form{display:grid;grid-template-columns:1fr 1fr 1fr 135px auto;gap:10px}input,select{min-width:0;padding:10px;border:1px solid var(--line);background:var(--s2);color:var(--t)}.muted{color:var(--m)}#error{color:#ff9aab;margin-top:10px}.person{border-top:1px solid var(--line);padding:15px 0;display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:14px}.person:first-child{border-top:0}.person-name{font-weight:800}.person-meta{color:var(--m);font-size:12px;margin-top:4px}.rights{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.right{display:flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--m)}.right:has(input:checked){border-color:#78d39a88;color:var(--green);background:#78d39a0f}.person-actions{display:flex;align-items:flex-start;gap:8px}.off{color:#ff9aab}@media(max-width:700px){form{grid-template-columns:1fr 1fr}form button{grid-column:1/-1}.person{grid-template-columns:1fr}.person-actions{order:-1}}
</style></head><body><header><h1>УПРАВЛЕНИЕ ДОСТУПАМИ</h1><span id="role" class="muted"></span><button class="back" onclick="location.href='/'">← В CRM</button></header><main><section><h2 id="formTitle">Новый участник</h2><form id="form" novalidate><input id="name" placeholder="Имя" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль (мин. 8 символов)" required><select id="roleSelect"><option value="assistant">Ассистент</option><option value="buyer">Баер</option></select><button class="primary">Выдать доступ</button></form><div id="error"></div></section><section><h2>Команда и права</h2><div id="list" class="muted">Загрузка…</div></section></main><script>
let me;const $=id=>document.getElementById(id),rights=[['dashboard','Dashboard'],['reports','Отчётность'],['tasks','Задачи'],['notes','Заметки'],['accs','Accs'],['creatives','Креативы'],['campaigns','Кампании']];const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(url,opts={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}function rightsUi(u){if(u.role!=='assistant')return '<span class="muted">Полный доступ роли</span>';return '<div class="rights">'+rights.map(([key,label])=>`<label class="right"><input type="checkbox" ${u.permissions?.[key]?'checked':''} onchange="toggleRight('${u.id}','${key}',this.checked)">${label}</label>`).join('')+'</div>'}async function render(){const d=await api('/api/users');$('list').innerHTML=d.users.map(u=>`<article class="person"><div><div class="person-name">${esc(u.name)} ${u.active?'':'<span class="off">— доступ отключён</span>'}</div><div class="person-meta">${esc(u.email)} · ${u.role==='buyer'?'Баер':u.role==='assistant'?'Ассистент':'Администратор'}</div>${rightsUi(u)}</div><div class="person-actions">${u.role!=='admin'?`<button onclick="toggleActive('${u.id}',${!u.active})">${u.active?'Отключить':'Включить'}</button>`:''}</div></article>`).join('')||'<div class="muted">Пока никого нет.</div>'}window.toggleRight=async(id,key,value)=>{try{const d=await api('/api/users');const u=d.users.find(x=>x.id===id);await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active:u.active,permissions:{...(u.permissions||{}),[key]:value}})});await render()}catch(e){$('error').textContent=e.message}};window.toggleActive=async(id,active)=>{try{const d=await api('/api/users');const u=d.users.find(x=>x.id===id);await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active,permissions:u.permissions||{}})});await render()}catch(e){$('error').textContent=e.message}};async function boot(){try{me=(await api('/api/auth/me')).user;$('role').textContent=me.role==='admin'?'Администратор':'Баер';if(me.role!=='admin')$('roleSelect').innerHTML='<option value="assistant">Ассистент</option>';$('formTitle').textContent=me.role==='admin'?'Создать доступ':'Добавить ассистента';await render()}catch(e){location.replace('/login')}}$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';try{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value,role:$('roleSelect').value,permissions:{}})});e.target.reset();await render()}catch(e){$('error').textContent=e.message}});boot();
</script></body></html>
