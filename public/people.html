<!doctype html><meta charset="utf-8"><title>Админка</title><style>body{margin:0;background:#09070a;color:#f5ece8;font:14px system-ui}main{max-width:1100px;margin:auto;padding:22px}section{margin:18px 0;padding:18px;background:#171016;border:1px solid #ffffff22;border-radius:10px}input,select,button{padding:10px;background:#0c080b;color:#f5ece8;border:1px solid #ffffff22;border-radius:6px}button{cursor:pointer}.node{position:absolute;min-width:180px}.muted{color:#aa9ca2}.right{margin:5px;display:inline-block}</style><main><button onclick="location.href='/'">← CRM</button><h1>АДМИНКА</h1><section><h2>Создать аккаунт</h2><form id="f"><input id="n" placeholder="Имя" required><input id="e" placeholder="Email" required><input id="p" placeholder="Пароль" type="password" required><select id="r"><option value="buyer">Баер</option><option value="assistant">Ассистент</option></select><select id="b"><option value="">Баер</option></select><button>Создать</button></form><div id="err"></div></section><section><h2>Полотно связей</h2><p class="muted">Выбери баера, затем ассистента — появится связь.</p><div id="g" style="position:relative;height:480px;background:#0c080b;border:1px solid #ffffff22;overflow:auto"></div></section><section><h2>Права редактирования</h2><div id="list"></div></section></main><script>
const $=x=>document.getElementById(x),F=['dashboard','reports','tasks','notes','accs','creatives','campaigns'];let U=[],selected=null;async function api(u,o={}){let r=await fetch(u,{credentials:'include',headers:{'Content-Type':'application/json'},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}async function draw(){U=(await api('/api/users')).users;$('b').innerHTML='<option value="">Баер</option>'+U.filter(x=>x.role==='buyer').map(x=>`<option value="${x.id}">${x.name}</option>`).join('');let buyers=U.filter(x=>x.role==='buyer'),as=U.filter(x=>x.role==='assistant'),s='<svg width="1000" height="480" style="position:absolute;pointer-events:none">';as.forEach((a,i)=>{let bi=buyers.findIndex(b=>b.id===a.workspaceId);if(bi>=0)s+=`<line x1="${150+bi*260}" y1="110" x2="${150+(i%3)*260}" y2="300" stroke="#ed294b" stroke-width="2"/>`});s+='</svg>';buyers.forEach((b,i)=>s+=`<button class="node" onclick="link('${b.id}')" style="left:${60+i*260}px;top:60px;border-color:${selected===b.id?'#ed294b':'#ffffff22'}">👑 ${b.name}<small><br>Баер</small></button>`);as.forEach((a,i)=>s+=`<button class="node" onclick="link('${a.id}')" style="left:${60+(i%3)*260}px;top:${260+Math.floor(i/3)*95}px">◈ ${a.name}<small><br>${buyers.find(b=>b.id===a.workspaceId)?.name||'Без связи'}</small></button>`);$('g').innerHTML=s;$('list').innerHTML=as.map(a=>`<div><b>${a.name}</b> `+F.map(k=>`<label class="right"><input type="checkbox" ${a.permissions?.[k]?'checked':''} onchange="right('${a.id}','${k}',this.checked)">${k}</label>`).join('')+'</div>').join('')}window.link=async id=>{let u=U.find(x=>x.id===id);if(u.role==='buyer'){selected=id;return draw()}if(u.role==='assistant'&&selected){await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active:u.active,permissions:u.permissions||{},workspaceId:selected})});selected=null;draw()}};window.right=async(id,k,v)=>{let u=U.find(x=>x.id===id);await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active:u.active,permissions:{...u.permissions,[k]:v}})});draw()};$('f').onsubmit=async e=>{e.preventDefault();try{await api('/api/users',{method:'POST',body:JSON.stringify({name:n.value,email:e.value,password:p.value,role:r.value,workspaceId:b.value})});draw()}catch(x){err.textContent=x.message}};api('/api/auth/me').then(x=>x.user.role==='admin'?draw():location='/');
</script><script>document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();try{await api('/api/users',{method:'POST',body:JSON.stringify({name:document.getElementById('n').value,email:document.getElementById('e').value,password:document.getElementById('p').value,role:document.getElementById('r').value,workspaceId:document.getElementById('b').value})});draw()}catch(x){document.getElementById('err').textContent=x.message}}</script>
