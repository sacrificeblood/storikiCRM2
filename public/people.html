<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minon Devils — админка</title><style>body{margin:0;background:#09070a;color:#f5ece8;font:14px system-ui}main{max-width:1000px;margin:auto;padding:24px}h1{font:900 26px Arial}section{margin:18px 0;padding:18px;border:1px solid #ffffff22;border-radius:10px;background:#171016}form{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:10px;border-radius:6px;border:1px solid #ffffff22;background:#0c080b;color:#f5ece8}button{cursor:pointer}.primary{background:#ed294b}.user{border-top:1px solid #ffffff22;padding:14px 0}.muted{color:#aa9ca2}.rights label{display:inline-flex;gap:4px;margin:8px 10px 0 0;font-size:12px}@media(max-width:650px){main{padding:14px}}</style><main><button onclick="location.href='/'">← CRM</button><h1>АДМИНКА</h1><section><h2>Создать аккаунт</h2><form id="f"><input id="n" placeholder="Имя" required><input id="e" placeholder="Email" type="email" required><input id="p" placeholder="Пароль от 8 символов" type="password" required><select id="r"><option value="buyer">Баер</option><option value="assistant">Ассистент</option></select><select id="b"><option value="">Баер для ассистента</option></select><button class="primary">Создать</button></form><div id="err"></div></section><section><h2>Баеры, ассистенты и доступы</h2><div id="list" class="muted">Загрузка…</div></section></main><script>
const $=x=>document.getElementById(x),F=[['dashboard','Dashboard'],['reports','Отчётность'],['tasks','Задачи'],['notes','Заметки'],['accs','Accs'],['creatives','Креативы'],['campaigns','Кампании']];let users=[];async function api(u,o={}){let r=await fetch(u,{credentials:'include',headers:{'Content-Type':'application/json'},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}async function draw(){users=(await api('/api/users')).users;$('b').innerHTML='<option value="">Баер для ассистента</option>'+users.filter(x=>x.role==='buyer'&&x.active).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('list').innerHTML=users.map(u=>`<div class="user"><b>${u.name}</b> <span class="muted">${u.email} · ${u.role}${u.role==='assistant'?' · баер: '+(users.find(x=>x.id===u.workspaceId)?.name||'—'):''}</span> ${u.role!=='admin'?`<button onclick="active('${u.id}',${!u.active})">${u.active?'Отключить':'Включить'}</button>`:''}${u.role==='assistant'?`<div class="rights">${F.map(([k,l])=>`<label><input type="checkbox" ${u.permissions?.[k]?'checked':''} onchange="right('${u.id}','${k}',this.checked)">${l}</label>`).join('')}</div>`:''}</div>`).join('')}window.active=async(id,a)=>{let u=users.find(x=>x.id===id);await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active:a,permissions:u.permissions||{}})});draw()};window.right=async(id,k,v)=>{let u=users.find(x=>x.id===id);await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active:u.active,permissions:{...u.permissions,[k]:v}})});draw()};$('r').onchange=()=>$('b').style.display=$('r').value==='assistant'?'block':'none';$('f').onsubmit=async e=>{e.preventDefault();try{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('n').value,email:$('e').value,password:$('p').value,role:$('r').value,workspaceId:$('b').value})});e.target.reset();draw()}catch(x){$('err').textContent=x.message}};api('/api/auth/me').then(x=>x.user.role==='admin'?draw():location.replace('/'));
</script>
