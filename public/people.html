<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карта CRM</title><style>
:root{color-scheme:dark;--bg:#09070a;--panel:#171016;--paper:#20171d;--ink:#f5ece8;--muted:#aa9ca2;--line:#ffffff20;--red:#ed294b;--blue:#6e9eff;--gold:#f0b06d;--green:#67d391}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.shell{height:100%;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:#100b0f}.top h1{margin:0;font:900 20px Arial Black,Arial}.spacer{flex:1}.btn{border:1px solid var(--line);background:#0c080b;border-radius:7px;padding:8px 11px}.btn:hover{border-color:#ed294b88}.primary{background:var(--red);border-color:var(--red);font-weight:800}.tools{display:flex;gap:7px;align-items:center}.zoom{min-width:54px;text-align:center;color:var(--muted);font:12px monospace}.board{position:relative;flex:1;min-height:620px;overflow:hidden;background:radial-gradient(circle at 20% 10%,#32101a44,transparent 32%),linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;touch-action:none}.world{position:absolute;width:3200px;height:2200px;transform-origin:0 0}.links{position:absolute;inset:0;width:3200px;height:2200px;overflow:visible}.link{fill:none;stroke:#ed294baa;stroke-width:2.5;pointer-events:stroke;cursor:pointer}.link:hover{stroke:#fff;stroke-width:4}.node{position:absolute;width:210px;min-height:92px;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:0 14px 35px #0007;user-select:none;touch-action:none}.node-head{height:5px;border-radius:10px 10px 0 0;background:var(--red)}.node-body{padding:12px}.node-title{font-weight:850;font-size:15px}.node-meta{margin-top:4px;color:var(--muted);font-size:11px}.node-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.node-actions button{border:1px solid var(--line);background:#0b080a;border-radius:5px;padding:5px 7px;font-size:11px}.admin .node-head{background:var(--red)}.buyer .node-head{background:var(--gold)}.canvas .node-head{background:var(--blue)}.assistant .node-head{background:var(--green)}.connect-target{outline:2px solid var(--red);outline-offset:3px}.hint{position:absolute;left:16px;bottom:16px;padding:9px 12px;border:1px solid var(--line);background:#100b0eee;border-radius:7px;color:var(--muted);font-size:12px;z-index:5}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--red);border-radius:10px;padding:20px}.modal h2{margin:0 0 14px}.field{display:grid;gap:6px;margin:11px 0}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:#0c080b;color:var(--ink)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:18px;bottom:18px;background:#20171d;border:1px solid var(--line);box-shadow:inset 3px 0 var(--red);padding:11px 14px;border-radius:6px;opacity:0;transform:translateY(12px);transition:.18s;z-index:80}.toast.show{opacity:1;transform:none}@media(max-width:700px){.top{flex-wrap:wrap}.top h1{width:100%}}
</style></head><body><div class="shell"><header class="top"><button class="btn" onclick="location.href='/'">← CRM</button><h1>КАРТА CRM-ПОЛОТЕН</h1><div class="spacer"></div><div class="tools"><button class="btn" id="addUser">+ Аккаунт</button><button class="btn" id="zoomOut">−</button><span class="zoom" id="zoomValue">100%</span><button class="btn" id="zoomIn">+</button><button class="btn" id="resetView">Центр</button></div></header><main class="board" id="board"><div class="world" id="world"><svg class="links" id="links"></svg></div><div class="hint" id="hint">Тяни карточки · колесо — зум · двойной клик по линии — убрать доступ</div></main></div><div class="toast" id="toast"></div><script>
const board=document.getElementById('board'),world=document.getElementById('world'),svg=document.getElementById('links');let users=[],canvases=[],access=[],zoom=1,panX=50,panY=40,drag=null,panning=null,connectCanvas=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opts={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}function transform(){world.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;document.getElementById('zoomValue').textContent=Math.round(zoom*100)+'%'}function pos(item,type,index){const x=item.graphX??item.graph_x,y=item.graphY??item.graph_y;if(Number.isFinite(x)&&Number.isFinite(y))return{x,y};const col=type==='admin'?0:type==='buyer'?1:type==='canvas'?2:3;return{x:90+col*650,y:90+(index%8)*155}}function center(id){const e=world.querySelector(`[data-node-id="${CSS.escape(id)}"]`);return e?{x:e.offsetLeft+e.offsetWidth/2,y:e.offsetTop+e.offsetHeight/2}:null}function curve(a,b){const d=Math.max(90,Math.abs(b.x-a.x)*.45);return`M ${a.x} ${a.y} C ${a.x+d} ${a.y}, ${b.x-d} ${b.y}, ${b.x} ${b.y}`}function path(from,to,kind,data={}){const a=center(from),b=center(to);if(!a||!b)return;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class','link');p.setAttribute('d',curve(a,b));p.dataset.kind=kind;Object.assign(p.dataset,data);p.ondblclick=removeLink;svg.appendChild(p)}async function removeLink(e){const p=e.currentTarget.dataset;if(p.kind!=='share'||!confirm('Убрать доступ ассистента?'))return;await api(`/api/canvases/${p.canvasId}/share/${p.userId}`,{method:'DELETE'});toast('Доступ убран');load()}function drawLinks(){svg.innerHTML='';const admin=users.find(u=>u.role==='admin');users.filter(u=>u.role==='buyer').forEach(b=>admin&&path('u:'+admin.id,'u:'+b.id,'owner'));canvases.forEach(c=>path('u:'+c.owner_id,'c:'+c.id,'owner'));access.forEach(a=>path('c:'+a.canvas_id,'u:'+a.user_id,'share',{canvasId:a.canvas_id,userId:a.user_id}))}
function card(item,type,index){const p=pos(item,type,index),el=document.createElement('article');el.className=`node ${type}`+(connectCanvas&&type==='assistant'?' connect-target':'');el.dataset.nodeId=(type==='canvas'?'c:':'u:')+item.id;el.dataset.kind=type;el.dataset.id=item.id;el.style.left=p.x+'px';el.style.top=p.y+'px';const title=type==='canvas'?item.name:item.name,meta=type==='admin'?'Админ':type==='buyer'?'Баер':type==='assistant'?'Ассистент':`CRM · ${item.owner_name}`;let actions='';if(type==='buyer')actions='<button data-action="add">+ Полотно</button>';if(type==='canvas')actions='<button data-action="open">Открыть</button><button data-action="connect">Связать</button><button data-action="rename">✎</button><button data-action="delete">✕</button>';if(type==='assistant'&&currentUser?.role==='admin')actions='<button data-action="rights">Права</button>';el.innerHTML=`<div class="node-head"></div><div class="node-body"><div class="node-title">${esc(title)}</div><div class="node-meta">${esc(meta)}</div><div class="node-actions">${actions}</div></div>`;el.onpointerdown=nodeDown;el.onclick=nodeClick;world.appendChild(el)}function render(){world.querySelectorAll('.node').forEach(x=>x.remove());['admin','buyer','canvas','assistant'].forEach(type=>(type==='canvas'?canvases:users.filter(u=>u.role===type)).forEach((x,i)=>card(x,type,i)));drawLinks();transform()}async function load(){const d=await api('/api/canvas-graph');users=d.users;canvases=d.canvases;access=d.access;render()}
function nodeDown(e){if(e.button!==0||e.target.closest('button'))return;e.stopPropagation();const el=e.currentTarget,r=el.getBoundingClientRect();drag={el,id:el.dataset.id,kind:el.dataset.kind,dx:(e.clientX-r.left)/zoom,dy:(e.clientY-r.top)/zoom,moved:false};el.setPointerCapture(e.pointerId)}function nodeClick(e){const el=e.currentTarget,a=e.target.closest('button')?.dataset.action;if(drag?.moved)return;if(connectCanvas&&el.dataset.kind==='assistant')return share(connectCanvas,el.dataset.id);if(a==='add')openCanvas(el.dataset.id);if(a==='open'){localStorage.setItem('minon-active-canvas',el.dataset.id);location.href='/'}if(a==='connect'){connectCanvas=el.dataset.id;document.getElementById('hint').textContent='Нажми на карточку ассистента';render()}if(a==='rename')openCanvas(null,canvases.find(c=>c.id===el.dataset.id));if(a==='delete')deleteCanvas(el.dataset.id);if(a==='rights')openRights(users.find(u=>u.id===el.dataset.id))}document.onpointermove=e=>{if(drag){const r=board.getBoundingClientRect();drag.el.style.left=((e.clientX-r.left-panX)/zoom-drag.dx)+'px';drag.el.style.top=((e.clientY-r.top-panY)/zoom-drag.dy)+'px';drag.moved=true;drawLinks()}else if(panning){panX=panning.px+e.clientX-panning.x;panY=panning.py+e.clientY-panning.y;transform()}};document.onpointerup=async()=>{if(drag?.moved){const x=parseInt(drag.el.style.left),y=parseInt(drag.el.style.top);await api(drag.kind==='canvas'?`/api/canvases/${drag.id}`:`/api/users/${drag.id}`,{method:'PATCH',body:JSON.stringify({x,y})}).catch(e=>toast(e.message))}drag=null;panning=null};board.onpointerdown=e=>{if(e.target===board||e.target===world||e.target===svg)panning={x:e.clientX,y:e.clientY,px:panX,py:panY}};board.onwheel=e=>{e.preventDefault();zoom=Math.max(.35,Math.min(1.8,zoom*(e.deltaY>0?.9:1.1)));transform()};async function share(c,u){await api(`/api/canvases/${c}/share`,{method:'POST',body:JSON.stringify({assistantId:u})});connectCanvas=null;document.getElementById('hint').textContent='Тяни карточки · колесо — зум · двойной клик по линии — убрать доступ';toast('Доступ выдан');load()}
function modal(html,save){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal">${html}<div class="modal-actions"><button class="btn" data-cancel>Отмена</button><button class="btn primary" data-save>Сохранить</button></div></div>`;document.body.appendChild(o);o.querySelector('[data-cancel]').onclick=()=>o.remove();o.querySelector('[data-save]').onclick=async()=>{try{await save(o);o.remove();load()}catch(e){toast(e.message)}}}function openCanvas(owner,item){modal(`<h2>${item?'Изменить':'Новое CRM-полотно'}</h2><label class="field">Название<input id="cn" value="${esc(item?.name||'')}"></label>`,async o=>{const name=o.querySelector('#cn').value.trim();await api(item?`/api/canvases/${item.id}`:'/api/canvases',{method:item?'PATCH':'POST',body:JSON.stringify(item?{name}:{name,ownerId:owner})});toast(item?'Переименовано':'Полотно создано')})}function openRights(user){const labels={dashboard:'Дашборд',notes:'Заметки',reports:'Отчётность',accs:'Аккаунты',creatives:'Креативы',campaigns:'Кампании',tasks:'Редактирование задач'};modal(`<h2>Права · ${esc(user.name)}</h2>${Object.entries(labels).map(([key,label])=>`<label class="field" style="display:flex;grid-template-columns:auto 1fr;align-items:center"><input type="checkbox" data-perm="${key}" ${user.permissions?.[key]?'checked':''}><span>${label}</span></label>`).join('')}`,async o=>{const permissions={};o.querySelectorAll('[data-perm]').forEach(x=>permissions[x.dataset.perm]=x.checked);await api('/api/users/'+user.id,{method:'PATCH',body:JSON.stringify({permissions})});toast('Права сохранены')})}async function deleteCanvas(id){if(!confirm('Удалить CRM-полотно? Полотно с данными удалить нельзя.'))return;try{await api('/api/canvases/'+id,{method:'DELETE'});toast('Полотно удалено');load()}catch(e){toast(e.message)}}document.getElementById('addUser').onclick=()=>modal(`<h2>Новый аккаунт</h2><label class="field">Имя<input id="un"></label><label class="field">Email<input id="ue" type="email"></label><label class="field">Пароль<input id="up" type="password"></label><label class="field">Роль<select id="ur"><option value="buyer">Баер</option><option value="assistant">Ассистент</option></select></label><label class="field">Баер<select id="ub"><option value="">Выберите</option>${users.filter(u=>u.role==='buyer').map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label>`,async o=>{await api('/api/users',{method:'POST',body:JSON.stringify({name:o.querySelector('#un').value,email:o.querySelector('#ue').value,password:o.querySelector('#up').value,role:o.querySelector('#ur').value,workspaceId:o.querySelector('#ub').value})});toast('Аккаунт создан')});document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(1.8,zoom*1.2);transform()};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.35,zoom/1.2);transform()};document.getElementById('resetView').onclick=()=>{zoom=1;panX=50;panY=40;transform()};let currentUser=null;api('/api/auth/me').then(d=>{currentUser=d.user;if(!['admin','buyer'].includes(currentUser.role))return location.replace('/');if(currentUser.role==='buyer'){document.getElementById('addUser').style.display='none';document.querySelector('h1').textContent='МОИ CRM-ПОЛОТНА'}load()}).catch(()=>location.replace('/login'));
</script></body></html>
