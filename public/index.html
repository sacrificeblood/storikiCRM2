<style>
  :root{
    --bg:#0a0a0a;
    --bg-2:#0d0d0d;
    --panel:#141414;
    --panel-2:#1a1a1a;
    --border:#2a2a2a;
    --border-soft:#1f1f1f;
    --green:#dc4a5c;
    --green-dim:#5a2229;
    --green-glow:rgba(220,74,92,0.22);
    --teal:#8890a0;
    --teal-glow:rgba(136,144,160,0.18);
    --text:#ececec;
    --text-dim:#8f8f8f;
    --danger:#c94868;
    --danger-glow:rgba(201,72,104,0.22);
    --amber:#d9b25a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Segoe UI', Tahoma, sans-serif;
    color:var(--text);
    background:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
      radial-gradient(ellipse at 30% 0%, rgba(220,74,92,0.05), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(255,255,255,0.02), transparent 55%),
      var(--bg);
    background-size:36px 36px, 36px 36px, cover, cover, cover;
    min-height:100vh;
  }
  #app{display:flex; flex-direction:column; min-height:100vh;}

  header{
    background:linear-gradient(180deg, #0b1310, #070c09);
    padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px;
    border-bottom:1px solid var(--border);
    box-shadow:0 4px 24px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.06);
    position:sticky; top:0; z-index:50;
  }
  header h1{
    font-size:19px; margin:0; letter-spacing:0.4px; font-weight:700;
    display:flex; align-items:center; gap:9px; color:var(--text);
  }
  header h1 .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--green); box-shadow:0 0 10px 2px var(--green-glow);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.4;}}

  .tabs{display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:8px; border:1px solid var(--border);}
  .tab-btn{
    padding:7px 16px; border:none; border-radius:6px; cursor:grab;
    background:transparent; color:var(--text-dim); font-size:13px; font-weight:600;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), filter .15s, background .2s, color .2s, box-shadow .25s;
    position:relative;
  }
  .tab-btn:hover{transform:translateY(-1px); color:var(--text);}
  .tab-btn.active{background:var(--green); color:#1a0505; box-shadow:0 0 12px var(--green-glow); animation:tabGlow 2.4s ease-in-out infinite;}
  .tab-btn.tab-dragging, .sheet-tab.tab-dragging{opacity:0.35; cursor:grabbing; transform:scale(0.96);}
  @keyframes tabGlow{0%,100%{box-shadow:0 0 10px var(--green-glow);} 50%{box-shadow:0 0 18px var(--green-glow);}}

  .sheet-tab{cursor:grab; transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .2s, color .2s;}
  .sheet-tab:hover{transform:translateY(-1px);}
  .sheet-tab.active{animation:tabGlow 2.4s ease-in-out infinite;}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .btn{
    padding:8px 14px; border-radius:6px; border:1px solid transparent; cursor:pointer;
    font-size:13px; font-weight:600; transition:transform .12s cubic-bezier(.34,1.56,.64,1), filter .1s, box-shadow .2s;
  }
  .btn:hover{filter:brightness(1.12); transform:translateY(-1px);}
  .btn:active{transform:scale(0.95);}
  .btn-fan{background:var(--green); color:#1a0505; box-shadow:0 0 10px var(--green-glow);}
  .btn-cre{background:var(--teal); color:#1a0505; box-shadow:0 0 10px var(--teal-glow);}
  .btn-layer{background:var(--amber); color:#241a02; box-shadow:0 0 10px rgba(232,193,90,0.4);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text); border-color:var(--green-dim);}
  .btn-danger{background:var(--danger); color:#210007; box-shadow:0 0 10px var(--danger-glow);}
  .btn-plain{background:var(--panel-2); color:var(--text); border:1px solid var(--border);}

  select.layer-picker{
    padding:8px 10px; border-radius:6px; border:1px solid var(--border-soft);
    background:var(--panel-2); color:var(--amber); font-size:13px; font-weight:700;
    max-width:180px;
  }

  main{flex:1; position:relative; overflow:hidden; display:flex; flex-direction:column;}
  #report-view, #board-outer, #table-view, #fanpage-view,
  #accsView, #creoView, #campaignView, #geoCipherView, #dashboardView, #tasksView{
    animation:viewFadeIn .28s ease-out;
  }
  @keyframes viewFadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* BOARD VIEW */
  .board-topbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:12px 26px; font-size:12.5px; color:var(--text-dim);
    border-bottom:1px solid var(--border-soft);
  }
  .zoom-controls{display:flex; align-items:center; gap:4px; margin-left:auto;}
  .zoom-controls button{
    width:28px; height:28px; border-radius:6px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer; font-size:15px; font-weight:700; line-height:1;
  }
  .zoom-controls button:hover{border-color:var(--green-dim); color:var(--green);}
  .zoom-controls .zoom-pct{font-size:12px; color:var(--text-dim); min-width:44px; text-align:center;}
  .zoom-controls .zoom-reset{width:auto; padding:0 10px; font-size:11.5px; font-weight:600;}

  #board-view{position:relative; overflow:hidden; flex:1; cursor:grab; background:rgba(0,0,0,0.08);}
  #board-view.panning{cursor:grabbing;}
  #board-canvas{position:absolute; top:0; left:0; transform-origin:0 0;}
  #board-svg{position:absolute; top:0; left:0; pointer-events:none; overflow:visible;}

  .signal-line{
    fill:none; stroke-width:2.4;
    filter:drop-shadow(0 0 4px var(--green-glow));
    stroke-dasharray:7 7;
    animation:flow 1.4s linear infinite;
    cursor:pointer;
  }
  @keyframes flow{to{stroke-dashoffset:-28;}}
  .signal-line-preview{
    fill:none; stroke:var(--teal); stroke-width:2.2; stroke-dasharray:5 5;
    filter:drop-shadow(0 0 4px var(--teal-glow));
  }
  .link-label-bg{fill:var(--bg-2); stroke:var(--border); stroke-width:1; opacity:0.92;}
  .link-label-text{font-size:11px; font-weight:700; fill:#ffcccc; font-family:'Segoe UI',sans-serif;}

  .note{
    position:absolute; width:190px; min-height:74px; padding:12px 12px 12px 14px;
    border-radius:8px; cursor:grab; user-select:none;
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);
    border-left:3px solid var(--green);
    box-shadow:0 4px 18px rgba(0,0,0,0.5);
    transition:box-shadow .15s, border-color .15s;
    font-size:13px; line-height:1.35;
  }
  .note.cre{border-left-color:var(--teal);}
  .note:active{cursor:grabbing;}
  .note:hover{box-shadow:0 6px 24px rgba(0,0,0,0.6), 0 0 16px var(--green-glow); z-index:20;}
  .note.cre:hover{box-shadow:0 6px 24px rgba(0,0,0,0.6), 0 0 16px var(--teal-glow);}
  .note .name{font-weight:700; color:var(--text); word-break:break-word; padding-right:2px;}
  .note .icon-spacer{float:right; width:78px; height:24px; shape-margin:0;}
  .note .sub{font-size:11px; color:var(--text-dim); margin-top:5px; letter-spacing:0.2px;}
  .note .del{
    position:absolute; top:8px; right:8px; width:18px; height:18px;
    border-radius:50%; border:none; background:rgba(255,93,115,0.12); color:var(--danger);
    font-size:12px; line-height:18px; text-align:center; cursor:pointer; padding:0;
  }
  .note .del:hover{background:var(--danger); color:#210007;}
  .note .edit-btn{
    right:30px; background:rgba(255,255,255,0.06); color:var(--green);
  }
  .note .edit-btn:hover{background:var(--green); color:#1a0505;}
  .connector{
    position:absolute; left:-9px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; border-radius:50%;
    background:var(--bg); border:3px solid var(--green); cursor:crosshair; z-index:5;
    box-shadow:0 0 8px var(--green-glow);
  }
  .note.cre .connector{left:auto; right:-9px; border-color:var(--teal); box-shadow:0 0 8px var(--teal-glow);}
  .note.linking-src{box-shadow:0 0 0 2px var(--teal), 0 0 18px var(--teal-glow);}

  /* TABLE VIEW */
  #table-view{padding:20px 26px 40px;}
  .filters-card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:16px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:end;
  }
  .filter-field{display:flex; flex-direction:column; gap:4px;}
  .filter-field label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim); font-weight:700;}
  .filter-field input, .filter-field select{
    padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13px; min-width:140px;
    background:var(--panel-2); color:var(--text);
  }
  .filter-field input:focus, .filter-field select:focus{outline:1px solid var(--green); outline-offset:0;}
  .result-count{margin-left:auto; font-size:12px; color:var(--text-dim); align-self:center;}

  table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden; border:1px solid var(--border);}
  thead tr{background:var(--panel-2);}
  th{color:var(--green); text-align:left; padding:10px 12px; font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid var(--border);}
  td{padding:10px 12px; font-size:13px; border-bottom:1px solid var(--border-soft); vertical-align:top;}
  tbody tr:hover{background:rgba(255,255,255,0.03);}
  .badge-fan{display:inline-block; padding:2px 9px; border-radius:10px; background:rgba(224,71,90,0.14); border:1px solid var(--green-dim); font-size:11px; font-weight:700; color:var(--green);}
  .badge-cre{display:inline-block; padding:2px 9px; border-radius:10px; background:rgba(136,144,160,0.14); border:1px solid var(--teal); font-size:11px; font-weight:700; color:var(--teal);}
  .badge-layer{display:inline-block; padding:2px 9px; border-radius:10px; background:rgba(232,193,90,0.14); border:1px solid var(--amber); font-size:11px; font-weight:700; color:var(--amber);}
  .link-cell{max-width:290px;}
  .link-entry{margin-bottom:5px;}
  .link-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; row-gap:2px;}
  .link-expand-cb{display:none;}
  .link-toggle-btn{
    cursor:pointer; color:var(--text-dim); font-size:10px; width:12px; flex:none;
    display:inline-block; text-align:center; user-select:none; transition:transform .15s;
  }
  .link-toggle-btn:hover{color:var(--green);}
  .link-expand-cb:checked ~ .link-row .link-toggle-btn{transform:rotate(90deg); color:var(--green);}
  .link-naming-short{
    max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    display:inline-block; vertical-align:middle;
  }
  .link-copy-badge{
    border:1px solid var(--amber); cursor:pointer; font-family:inherit; transition:filter .1s, transform .1s;
  }
  .link-copy-badge:hover{filter:brightness(1.25);}
  .link-copy-badge:active{transform:scale(0.96);}
  .link-full-details{
    display:none; margin:5px 0 2px 20px; padding:8px 10px; background:var(--panel-2);
    border:1px solid var(--border); border-radius:6px; font-size:11.5px; color:var(--text-dim);
    word-break:break-all; line-height:1.5;
  }
  .link-full-details strong{color:var(--text); font-weight:700;}
  .link-full-details a{
    color:#79d9ff; max-width:none; white-space:normal; overflow:visible; text-overflow:clip; display:inline;
  }
  .link-expand-cb:checked ~ .link-full-details{display:block;}
  .link-actions{display:flex; gap:6px; margin-top:6px;}
  .link-action-btn{
    padding:4px 9px; border-radius:5px; border:1px solid var(--border); background:var(--panel);
    color:var(--text-dim); cursor:pointer; font-size:11px; font-weight:600;
  }
  .link-action-btn:hover{border-color:var(--green); color:var(--green);}
  .link-icon-btn{
    flex:none; width:20px; height:20px; border-radius:5px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text-dim); cursor:pointer; font-size:10.5px;
    line-height:1; padding:0; margin-left:2px;
  }
  .link-icon-btn:hover{border-color:var(--green); color:var(--green); background:rgba(255,255,255,0.05);}
  .link-row .num{color:var(--text-dim); font-size:11px; width:14px; flex:none;}
  .link-cell a{
    color:#79d9ff; text-decoration:none; font-size:12.5px;
    display:inline-block; max-width:170px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; vertical-align:middle;
  }
  .link-cell a:hover{text-decoration:underline;}
  .muted{color:var(--text-dim);}
  .row-actions{display:flex; gap:6px;}
  .row-actions button{border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:12px; font-weight:600;}
  .empty-state{padding:40px; text-align:center; color:var(--text-dim); background:var(--panel); border:1px solid var(--border); border-radius:10px;}

  /* MODAL */
  .overlay{
    position:fixed; inset:0; background:rgba(2,6,4,0.7); z-index:500;
    display:flex; align-items:center; justify-content:center; padding:16px;
    animation:overlayFadeIn .18s ease-out;
  }
  @keyframes overlayFadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:22px; width:100%; max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    max-height:88vh; overflow-y:auto;
    animation:modalPopIn .22s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalPopIn{from{opacity:0; transform:scale(0.92) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .modal h3{margin:0 0 14px 0; font-size:15.5px; color:var(--text);}
  .modal .field{margin-bottom:12px; display:flex; flex-direction:column; gap:5px;}
  .modal label{font-size:11.5px; font-weight:700; color:var(--text-dim); letter-spacing:0.3px;}
  .modal input, .modal select{padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; background:var(--panel-2); color:var(--text); transition:border-color .15s, box-shadow .15s;}
  .modal input:focus, .modal select:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-glow);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .modal-actions .spacer{flex:1;}
  .url-row{display:flex; gap:6px; align-items:center;}
  .url-row input{flex:1;}
  .url-remove{
    flex:none; width:28px; height:28px; border-radius:6px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--danger); cursor:pointer; font-size:14px;
  }
  .url-remove:hover{background:var(--danger); color:#210007;}
  .add-url-btn{
    margin-top:2px; padding:7px 10px; border-radius:6px; border:1px dashed var(--border);
    background:transparent; color:var(--green); cursor:pointer; font-size:12.5px; font-weight:600; text-align:left;
  }
  .add-url-btn:hover{border-color:var(--green);}
  .add-url-btn:disabled{opacity:0.35; cursor:not-allowed;}

  .layer-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .layer-row input{flex:1;}
  .layer-row .count{font-size:11px; color:var(--text-dim); flex:none; min-width:90px; text-align:right;}
  .layer-row button{
    flex:none; width:28px; height:28px; border-radius:6px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--danger); cursor:pointer; font-size:14px;
  }
  .layer-row button:hover{background:var(--danger); color:#210007;}
  .layer-add-row{display:flex; gap:6px; margin-top:10px;}
  .layer-add-row input{flex:1;}

  .loading{padding:60px; text-align:center; color:var(--text-dim); font-size:14px;}

  /* REPORT VIEW */
  #report-view{padding:20px 26px 40px;}
  .report-sheets-bar{display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:0;}
  .sheet-tab{
    padding:9px 18px; border:1px solid var(--border); border-bottom:none; border-radius:8px 8px 0 0;
    background:var(--panel-2); color:var(--text-dim); cursor:pointer; font-size:13px; font-weight:600;
    margin-bottom:-1px;
  }
  .sheet-tab.active{background:var(--panel); color:var(--green); border-color:var(--green-dim);}
  .report-month-bar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px; font-size:14px; font-weight:700; color:var(--text);
  }
  .report-nav-btn{
    width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--panel-2);
    color:var(--text); cursor:pointer; font-size:14px;
  }
  .report-nav-btn:hover{border-color:var(--green); color:var(--green);}
  #reportMonthLabel{min-width:150px; text-align:center;}
  table.report-table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden; border:1px solid var(--border);}
  table.report-table th{
    color:var(--green); text-align:left; padding:9px 12px; font-size:11.5px; text-transform:uppercase;
    letter-spacing:0.5px; border-bottom:1px solid var(--border); background:var(--panel-2);
  }
  table.report-table td{padding:6px 12px; font-size:13px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  table.report-table tbody tr:hover{background:rgba(255,255,255,0.03);}
  table.report-table tr.weekend-row{background:rgba(232,193,90,0.05);}
  table.report-table tfoot td{
    padding:10px 12px; font-weight:700; border-top:2px solid var(--border); background:var(--panel-2); font-size:13.5px;
  }
  .report-input{
    width:100px; padding:6px 8px; border:1px solid var(--border); border-radius:5px; font-size:13px;
    background:var(--panel-2); color:var(--text);
  }
  .report-input:focus{outline:1px solid var(--green);}
  .report-profit, .report-roi{font-weight:700; font-variant-numeric:tabular-nums;}

  /* ACCS TREE VIEW */
  .accs-group{margin-bottom:6px; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .accs-agent-header{
    display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--panel-2);
    cursor:pointer; font-weight:700; font-size:13.5px; color:var(--text); user-select:none;
  }
  .accs-agent-header:hover{background:rgba(255,255,255,0.04);}
  .accs-agent-header .count{font-weight:400; color:var(--text-dim); font-size:11.5px;}
  .accs-soc-block{border-top:1px solid var(--border-soft);}
  .accs-soc-header{
    display:flex; align-items:center; gap:8px; padding:8px 14px 8px 30px; background:var(--panel);
    cursor:pointer; font-weight:600; font-size:12.5px; color:var(--teal); user-select:none;
  }
  .accs-soc-header:hover{background:rgba(255,255,255,0.03);}
  .accs-soc-header .count{font-weight:400; color:var(--text-dim); font-size:11px;}
  .accs-caret{display:inline-block; width:10px; font-size:10px; transition:transform .15s; color:var(--text-dim);}
  .accs-caret.open{transform:rotate(90deg);}
  table.accs-table{width:100%; border-collapse:collapse;}
  table.accs-table th{
    color:var(--green); text-align:left; padding:7px 12px 7px 46px; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.4px; background:var(--panel); border-bottom:1px solid var(--border-soft);
  }
  table.accs-table td{padding:7px 12px; font-size:12.5px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  table.accs-table td:first-child{padding-left:46px;}
  table.accs-table tbody tr{transition:background .12s;} table.accs-table tbody tr:hover{background:rgba(255,255,255,0.05);}
  .accs-status-badge{
    display:inline-block; padding:3px 9px; border-radius:10px; font-size:10.5px; font-weight:700; border:1px solid;
    cursor:pointer; font-family:inherit;
  }
  .accs-status-badge:hover{filter:brightness(1.2);}
  .accs-note-btn{
    border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim); border-radius:6px;
    padding:3px 8px; font-size:11px; cursor:pointer; font-family:inherit;
  }
  .accs-note-btn:hover{border-color:var(--amber); color:var(--amber);}
  .accs-mini-btn{
    border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim); border-radius:5px;
    padding:3px 8px; font-size:11px; cursor:pointer; font-family:inherit; margin-left:4px;
  }
  .accs-mini-btn:hover{border-color:var(--green); color:var(--green);}
  .del-agent-btn:hover, .del-soc-btn:hover, .del-acc-btn:hover{border-color:var(--danger); color:var(--danger);}

  /* CREOCHECKER */
  .os-badge{display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700; border:1px solid;}
  .creo-table-scroll{overflow-x:auto; border-radius:0 0 8px 8px;}
  table.creo-table{width:100%; border-collapse:collapse; min-width:1180px;}
  table.creo-table th{
    color:var(--green); text-align:left; padding:7px 10px; font-size:10px; text-transform:uppercase;
    letter-spacing:0.3px; background:var(--panel); border-bottom:1px solid var(--border-soft); white-space:nowrap;
  }
  table.creo-table td{padding:7px 10px; font-size:12px; border-bottom:1px solid var(--border-soft); vertical-align:middle; white-space:nowrap;}
  table.creo-table tbody tr{transition:background .12s;} table.creo-table tbody tr:hover{background:rgba(255,255,255,0.05);}
  .creo-feed-btn{
    border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim); border-radius:6px;
    padding:3px 8px; font-size:11px; cursor:pointer; font-family:inherit; max-width:140px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; display:inline-block; vertical-align:middle;
  }
  .creo-feed-btn:hover{border-color:var(--amber); color:var(--amber);}
  .creo-paste-btn{
    border:1px solid var(--green-dim); background:rgba(220,74,92,0.1); color:var(--green); border-radius:6px;
    padding:4px 10px; font-size:11px; cursor:pointer; font-family:inherit; font-weight:700;
  }
  .creo-paste-btn:hover{filter:brightness(1.2);}

  /* CAMPAIGN */
  table.camp-table{width:100%; border-collapse:collapse; min-width:1300px;}
  table.camp-table th{
    color:var(--green); text-align:left; padding:7px 10px; font-size:10px; text-transform:uppercase;
    letter-spacing:0.3px; background:var(--panel); border-bottom:1px solid var(--border-soft); white-space:nowrap;
  }
  table.camp-table td{padding:7px 10px; font-size:12px; border-bottom:1px solid var(--border-soft); vertical-align:middle; white-space:nowrap;}
  table.camp-table tr.camp-row-active{background:rgba(76,175,107,0.08);}
  table.camp-table tr.camp-row-reject{background:rgba(220,74,92,0.1);}
  table.camp-table tr.camp-row-paused{background:rgba(217,178,90,0.08);}
  table.camp-table tr.camp-row-active:hover{background:rgba(76,175,107,0.14);}
  table.camp-table tr.camp-row-reject:hover{background:rgba(220,74,92,0.16);}
  table.camp-table tr.camp-row-paused:hover{background:rgba(217,178,90,0.14);}
  .camp-task-btn, .camp-comment-btn{
    border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim); border-radius:6px;
    padding:3px 8px; font-size:11px; cursor:pointer; font-family:inherit; max-width:130px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; display:inline-block; vertical-align:middle;
  }
  .camp-task-btn:hover, .camp-comment-btn:hover{border-color:var(--amber); color:var(--amber);}
  .camp-domain-link{color:#79d9ff; text-decoration:none;}
  .camp-domain-link:hover{text-decoration:underline;}

  /* DASHBOARD */
  #dashboardWrap{padding:4px 0;}
  .dash-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin-bottom:22px;}
  .dash-card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px 18px; transition:transform .2s cubic-bezier(.34,1.56,.64,1), border-color .2s, box-shadow .2s; animation:cardFadeIn .35s ease-out backwards;}
  .dash-card:hover{transform:translateY(-3px); border-color:var(--green-dim); box-shadow:0 8px 20px rgba(0,0,0,0.35);}
  .dash-grid .dash-card:nth-child(1){animation-delay:.02s;} .dash-grid .dash-card:nth-child(2){animation-delay:.06s;}
  .dash-grid .dash-card:nth-child(3){animation-delay:.10s;} .dash-grid .dash-card:nth-child(4){animation-delay:.14s;}
  .dash-grid .dash-card:nth-child(5){animation-delay:.18s;} .dash-grid .dash-card:nth-child(6){animation-delay:.22s;}
  @keyframes cardFadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .dash-card .dash-label{font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); margin-bottom:6px;}
  .dash-card .dash-value{font-size:26px; font-weight:800; color:var(--text);}
  .dash-card .dash-sub{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .dash-section-title{font-size:13px; font-weight:700; color:var(--green); text-transform:uppercase; letter-spacing:0.5px; margin:22px 0 10px;}

  /* TASKS (trello-style board) */
  .tasks-board{display:flex; gap:16px; align-items:flex-start; overflow-x:auto; padding-bottom:10px;}
  .tasks-column{background:var(--panel); border:1px solid var(--border); border-radius:10px; min-width:280px; max-width:280px; padding:12px; flex-shrink:0;}
  .tasks-column-header{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13px; margin-bottom:10px; padding:0 4px;}
  .tasks-column-header .count{color:var(--text-dim); font-weight:400; font-size:11.5px;}
  .task-card{background:var(--panel-2); border:1px solid var(--border-soft); border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .2s, box-shadow .2s;}
  .task-card:hover{transform:translateY(-2px) scale(1.01); box-shadow:0 6px 16px rgba(0,0,0,0.3);}
  .task-card:hover{border-color:var(--green-dim);}
  .task-card .task-title{font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; word-break:break-word;}
  .task-card .task-desc{font-size:11.5px; color:var(--text-dim); word-break:break-word; white-space:pre-wrap;}
  .task-card .task-move-row{display:flex; gap:4px; margin-top:8px;}
  .task-move-btn{
    flex:1; border:1px solid var(--border); background:var(--panel); color:var(--text-dim); border-radius:5px;
    padding:3px 4px; font-size:11px; cursor:pointer; font-family:inherit;
  }
  .task-move-btn:hover{border-color:var(--green); color:var(--green);}
  .task-move-btn:disabled{opacity:0.3; cursor:default;}
  .task-move-btn:disabled:hover{border-color:var(--border); color:var(--text-dim);}
  .task-del-btn{border:none; background:none; color:var(--text-dim); cursor:pointer; font-size:12px; padding:2px 4px;}
  .task-del-btn:hover{color:var(--danger);}
  .tasks-empty{color:var(--text-dim); font-size:12px; text-align:center; padding:20px 0;}
  .ctx-menu{
    position:fixed; z-index:600; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; box-shadow:0 12px 34px rgba(0,0,0,0.6); padding:6px; min-width:210px;
    display:flex; flex-direction:column; gap:2px;
  }
  .ctx-item{
    background:transparent; border:none; color:var(--text); text-align:left;
    padding:9px 11px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .ctx-item:hover{background:rgba(255,255,255,0.06); color:var(--green);}
  .ctx-item.cre-item:hover{background:rgba(255,255,255,0.06); color:var(--teal);}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--panel); color:var(--text); padding:10px 18px; border-radius:8px; border:1px solid var(--green-dim);
    font-size:13px; z-index:200; box-shadow:0 4px 20px rgba(0,0,0,0.6), 0 0 14px var(--green-glow);
    opacity:0; transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  /* AUTH SCREEN */
  #authScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .auth-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px;
    width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
  }
  .auth-card h1{font-size:18px; margin:0 0 4px 0; display:flex; align-items:center; gap:8px;}
  .auth-card .sub{font-size:12.5px; color:var(--text-dim); margin-bottom:18px;}
  .auth-tabs{display:flex; gap:4px; background:var(--panel-2); padding:4px; border-radius:8px; margin-bottom:18px;}
  .auth-tabs button{
    flex:1; padding:7px; border:none; border-radius:6px; cursor:pointer; background:transparent;
    color:var(--text-dim); font-size:13px; font-weight:600;
  }
  .auth-tabs button.active{background:var(--green); color:#1a0505;}
  .auth-field{margin-bottom:12px; display:flex; flex-direction:column; gap:5px;}
  .auth-field label{font-size:11.5px; font-weight:700; color:var(--text-dim);}
  .auth-field input{padding:10px; border:1px solid var(--border); border-radius:6px; font-size:14px; background:var(--panel-2); color:var(--text);}
  .auth-field input:focus{outline:1px solid var(--green);}
  .auth-error{color:var(--danger); font-size:12.5px; margin-bottom:10px; min-height:16px;}
  .auth-submit{
    width:100%; padding:10px; border-radius:6px; border:none; background:var(--green); color:#1a0505;
    font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 0 10px var(--green-glow);
  }
  .auth-submit:disabled{opacity:0.5; cursor:not-allowed;}
  #logoutBtn{margin-left:6px;}
</style>
</head>
<body>

  <header>

    <div class="tabs">
      <button class="tab-btn active" data-view="dashboard" id="tabDashboardBtn">Dashboard</button>
      <button class="tab-btn" data-view="report" id="tabReportBtn">Отчётность</button>
      <button class="tab-btn" data-view="tasks" id="tabTasksBtn">Задачи</button>
    </div>
    <div class="toolbar">
      <button class="btn btn-ghost" id="trashBtn">История</button>
      <button class="btn btn-ghost" id="backupsBtn">Бэкапы</button>
      <span id="saveIndicator" style="font-size:11px; color:var(--text-dim); margin-left:4px; white-space:nowrap;">Сохранено ✓</span>
      <button class="btn btn-ghost" id="resetBtn">Очистить всё</button>
    </div>
  </header>

  <main>
    <div id="loadingBox" class="loading">Загрузка доски…</div>

    <div id="board-outer" style="display:none; flex:1; flex-direction:column; min-height:0;">
      <div class="board-topbar">
        <div class="zoom-controls">
          <button id="zoomOutBtn" title="Уменьшить">−</button>
          <span class="zoom-pct" id="zoomPct">100%</span>
          <button id="zoomInBtn" title="Увеличить">+</button>
          <button class="zoom-reset" id="zoomResetBtn" title="Сбросить вид">Сброс</button>
        </div>
      </div>
      <div id="board-view">
        <div id="board-canvas">
          <svg id="board-svg"></svg>
        </div>
      </div>
    </div>

    <div id="table-view" style="display:none;">
      <div class="filters-card">
        <div class="filter-field">
          <label>Поиск</label>
          <input type="text" id="fSearch" placeholder="фанпейдж, креатив, гео, ссылка...">
        </div>
        <div class="filter-field">
          <label>Фанпейдж</label>
          <select id="fFan"><option value="">Все</option></select>
        </div>
        <div class="filter-field">
          <label>Креатив</label>
          <select id="fCre"><option value="">Все</option></select>
        </div>
        <div class="filter-field">
          <label>Гео</label>
          <select id="fGeo"><option value="">Все</option></select>
        </div>
        <button class="btn btn-ghost" id="clearFiltersBtn" style="align-self:end;">Сбросить фильтры</button>
        <div class="result-count" id="resultCount"></div>
      </div>
      <div id="tableWrap"></div>
    </div>

    <div id="fanpage-view" style="display:none;">
      <div class="filters-card">
        <div class="filter-field">
          <label>Поиск</label>
          <input type="text" id="fpSearch" placeholder="название, гео, ссылка...">
        </div>
        <div class="filter-field">
          <label>Гео</label>
          <select id="fpGeo"><option value="">Все</option></select>
        </div>
        <div class="filter-field">
          <label>Статус</label>
          <select id="fpStatus">
            <option value="">Все</option>
            <option value="active">Используется</option>
            <option value="inactive">Не используется</option>
          </select>
        </div>
        <div class="filter-field">
          <label>Пол</label>
          <select id="fpGender">
            <option value="">Все</option>
            <option value="M">Мужчина (М)</option>
            <option value="F">Женщина (Ж)</option>
          </select>
        </div>
        <button class="btn btn-fan" id="addFanFromListBtn" style="align-self:end;">+ Добавить фанпейдж</button>
        <button class="btn btn-cre" id="bulkAddFanBtn" style="align-self:end;">+ Добавить списком</button>
        <button class="btn btn-ghost" id="clearFpFiltersBtn" style="align-self:end;">Сбросить фильтры</button>
        <div class="result-count" id="fpResultCount"></div>
      </div>
      <div id="fanpageTableWrap"></div>
    </div>

    <div id="report-view" style="display:none;">
      <div class="report-sheets-bar">
        <button class="sheet-tab active" id="sheetSpendRevBtn" data-sheet="spendRev">Spend/Rev</button>
        <button class="sheet-tab" id="sheetAccsBtn" data-sheet="accs">Accs</button>
        <button class="sheet-tab" id="sheetCreoBtn" data-sheet="creoChecker">CreoChecker</button>
        <button class="sheet-tab" id="sheetCampaignBtn" data-sheet="campaign">Campaign</button>
        <button class="sheet-tab" id="sheetGeoCipherBtn" data-sheet="geoCipher">Шифр GEO</button>
      </div>
      <div class="report-month-bar" id="reportMonthBar">
        <button class="report-nav-btn" id="reportPrevMonth" title="Предыдущий месяц">←</button>
        <span id="reportMonthLabel">—</span>
        <button class="report-nav-btn" id="reportNextMonth" title="Следующий месяц">→</button>
        <button class="btn btn-ghost" id="reportTodayBtn" style="margin-left:10px;">Текущий месяц</button>
      </div>
      <div id="reportTableWrap"></div>

      <div id="accsView" style="display:none;">
        <div class="filters-card">
          <div class="filter-field">
            <label>Поиск</label>
            <input type="text" id="accSearch" placeholder="agent, soc, id, заметка, пиксель...">
          </div>
          <div class="filter-field">
            <label>Agent</label>
            <select id="accAgentFilter"><option value="">Все</option></select>
          </div>
          <div class="filter-field">
            <label>Soc</label>
            <select id="accSocFilter"><option value="">Все</option></select>
          </div>
          <div class="filter-field">
            <label>Статус</label>
            <select id="accStatusFilter">
              <option value="">Все</option>
              <option value="approved">Approved</option>
              <option value="perfect">Perfect</option>
              <option value="disabled">Disabled</option>
              <option value="not_spending">Not spending</option>
              <option value="payment_error">Payment error</option>
            </select>
          </div>
          <button class="btn btn-fan" id="addAccBtn" style="align-self:end;">+ Добавить агента</button>
          <button class="btn btn-ghost" id="clearAccFiltersBtn" style="align-self:end;">Сбросить фильтры</button>
          <div class="result-count" id="accResultCount"></div>
        </div>
        <div id="accsTreeWrap"></div>
      </div>

      <div id="creoView" style="display:none;">
        <div class="report-month-bar">
          <button class="report-nav-btn" id="creoPrevDay" title="Предыдущий день">←</button>
          <span id="creoDayLabel">—</span>
          <button class="report-nav-btn" id="creoNextDay" title="Следующий день">→</button>
          <button class="btn btn-ghost" id="creoTodayBtn" style="margin-left:10px;">Сегодня</button>
        </div>
        <div class="filters-card">
          <div class="filter-field">
            <label>Поиск</label>
            <input type="text" id="creoSearch" placeholder="гео, название, feed...">
          </div>
          <div class="filter-field">
            <label>Гео</label>
            <select id="creoGeoFilter"><option value="">Все</option></select>
          </div>
          <div class="filter-field">
            <label>OS</label>
            <select id="creoOsFilter">
              <option value="">Все</option>
              <option value="ios">iOS</option>
              <option value="pwa">PWA</option>
              <option value="all">ALL</option>
            </select>
          </div>
          <button class="btn btn-fan" id="addGeoBtn" style="align-self:end;">+ Добавить гео</button>
          <button class="btn btn-ghost" id="clearCreoFiltersBtn" style="align-self:end;">Сбросить фильтры</button>
          <div class="result-count" id="creoResultCount"></div>
        </div>
        <div id="creoTreeWrap"></div>
      </div>

      <div id="campaignView" style="display:none;">
        <div class="report-month-bar">
          <button class="report-nav-btn" id="campPrevDay" title="Предыдущий день">←</button>
          <span id="campDayLabel">—</span>
          <button class="report-nav-btn" id="campNextDay" title="Следующий день">→</button>
          <button class="btn btn-ghost" id="campTodayBtn" style="margin-left:10px;">Сегодня</button>
        </div>
        <div class="filters-card">
          <div class="filter-field">
            <label>Поиск</label>
            <input type="text" id="campSearch" placeholder="гео, название, крео, кабинет, домен, fp...">
          </div>
          <div class="filter-field">
            <label>Гео</label>
            <select id="campGeoFilter"><option value="">Все</option></select>
          </div>
          <div class="filter-field">
            <label>Статус</label>
            <select id="campStatusFilter">
              <option value="">Все</option>
              <option value="active">Актив</option>
              <option value="reject">Реджект</option>
              <option value="paused">Пауза</option>
            </select>
          </div>
          <button class="btn btn-fan" id="addCampGeoBtn" style="align-self:end;">+ Добавить гео</button>
          <button class="btn btn-ghost" id="clearCampFiltersBtn" style="align-self:end;">Сбросить фильтры</button>
          <div class="result-count" id="campResultCount"></div>
        </div>
        <div id="campTreeWrap"></div>
      </div>

      <div id="geoCipherView" style="display:none;">
        <div class="filters-card">
          <div class="filter-field">
            <label>Поиск</label>
            <input type="text" id="gcSearch" placeholder="geo, solo, europe...">
          </div>
          <button class="btn btn-fan" id="addGeoCipherBtn" style="align-self:end;">+ Добавить GEO</button>
          <button class="btn btn-ghost" id="clearGcFiltersBtn" style="align-self:end;">Сбросить фильтры</button>
          <div class="result-count" id="gcResultCount"></div>
        </div>
        <div id="geoCipherTableWrap"></div>
      </div>
    </div>

    <div id="dashboardView" style="display:none;">
      <div id="dashboardWrap"></div>
    </div>

    <div id="tasksView" style="display:none;">
      <div class="filters-card">
        <button class="btn btn-fan" id="addTaskBtn" style="align-self:end;">+ Добавить задачу</button>
      </div>
      <div id="tasksBoardWrap"></div>
    </div>
  </main>
</div>

<datalist id="fpAutocomplete"></datalist>
<datalist id="domainAutocomplete"></datalist>
<datalist id="bidBudgetAutocomplete"></datalist>
<datalist id="pixelAutocomplete"></datalist>

<div id="toast" class="toast"></div>

<script src="app.js?v=18"></script>
<script src="storage-shim.js?v=18"></script>
</body>
</html>
