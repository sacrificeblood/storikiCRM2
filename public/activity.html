<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Активность команды</title><style>body{margin:0;background:#09070a;color:#f5ece8;font:14px system-ui}main{max-width:760px;margin:auto;padding:24px}.row{padding:14px 0;border-bottom:1px solid #ffffff22}.muted{color:#aa9ca2}button{padding:9px;background:#171016;color:#f5ece8;border:1px solid #ffffff22;border-radius:6px}</style><main><button onclick="location.href='/'">← CRM</button><h1>Активность ассистентов</h1><div id="x" class="muted">Загрузка…</div></main><script>fetch('/api/activity',{credentials:'include'}).then(r=>r.json()).then(d=>x.innerHTML=(d.entries||[]).map(e=>`<div class="row"><b>${e.user_email}</b> — ${e.action}<div class="muted">${new Date(e.created_at).toLocaleString('ru-RU')}</div></div>`).join('')||'Пока нет действий').catch(()=>location='/login')</script>
