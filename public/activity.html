<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Активность команды</title><style>body{margin:0;background:radial-gradient(circle at 10% 0,#0a3b1d,#020806 42%);color:#eefbf3;font:14px system-ui}main{max-width:760px;margin:auto;padding:24px}.row{padding:14px 0;border-bottom:1px solid #baffd322}.muted{color:#8eaa98}button{padding:9px;background:#07130d;color:#eefbf3;border:1px solid #baffd322;border-radius:6px;cursor:pointer}button:hover{border-color:#2eea72}</style><main><button onclick="location.href='/'">← CRM</button><h1>Активность ассистентов</h1><div id="x" class="muted">Загрузка…</div></main><script>fetch('/api/activity',{credentials:'include'}).then(r=>r.json()).then(d=>x.innerHTML=(d.entries||[]).map(e=>`<div class="row"><b>${e.user_email}</b> — ${e.action}<div class="muted">${new Date(e.created_at).toLocaleString('ru-RU')}</div></div>`).join('')||'Пока нет действий').catch(()=>location='/login')</script>
