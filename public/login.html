<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minon Devils — вход</title>
  <style>
    :root{color-scheme:dark;--bg:#09070a;--surface:#171016;--line:rgba(245,236,232,.16);--text:#f5ece8;--muted:#aa9ca2;--red:#ed294b}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(70% 48% at 50% 0%,#35101a 0%,var(--bg) 62%);font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--text)}
    main{width:min(100%,390px);border:1px solid var(--line);border-top:2px solid var(--red);background:var(--surface);padding:28px;border-radius:12px;box-shadow:0 28px 80px #0009}h1{margin:0 0 5px;font:900 27px/1 Arial Black,Arial,sans-serif;letter-spacing:-1.4px}p{margin:0 0 24px;color:var(--muted);font-size:14px}label{display:grid;gap:7px;margin:14px 0;font-size:12px;font-weight:700}input{width:100%;height:44px;border:1px solid var(--line);border-radius:7px;background:#0c080b;color:var(--text);padding:0 12px;font:inherit}input:focus{outline:2px solid #ed294b66;border-color:var(--red)}button{width:100%;height:44px;margin-top:10px;border:0;border-radius:7px;background:var(--red);color:white;font:800 14px/1 inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:18px;margin-top:12px;color:#ff9aab;font-size:13px}.foot{margin:20px 0 0;font-size:11px;color:#70636a;text-align:center}
  </style>
</head>
<body>
  <main>
    <h1>MINON DEVILS</h1>
    <p>Вход в закрытое рабочее пространство.</p>
    <form id="loginForm" novalidate>
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Пароль<input id="password" type="password" autocomplete="current-password" required></label>
      <button id="submit" type="submit">Войти</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <div class="foot">Доступ выдаёт администратор.</div>
  </main>
  <script>
    fetch('/api/auth/me',{credentials:'include'}).then(r=>{if(r.ok)location.replace('/');});
    document.getElementById('loginForm').addEventListener('submit',async e=>{
      e.preventDefault(); const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
      const button=document.getElementById('submit'), error=document.getElementById('error'); error.textContent=''; button.disabled=true; button.textContent='Входим…';
      try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email,password})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Не удалось войти');location.replace('/');}catch(err){error.textContent=err.message;button.disabled=false;button.textContent='Войти';}
    });
  </script>
</body>
</html>
